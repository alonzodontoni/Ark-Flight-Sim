[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ark"
version = "0.1.0"
description = "6DOF flight simulator for passively stable rockets, with Monte Carlo dispersion and a web replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ark = "ark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741", "E702", "E701", "E731"]
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E402"]
